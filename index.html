<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnginX — Industrial Engineering Calculators</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EEX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark">EX</span>
        <div class="brand-text">
          <div class="brand-title">EnginX</div>
          <div class="brand-sub">Steel &amp; Rolling Mill Engineering Calculators</div>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchBox" class="search-box" type="text" placeholder="Search calculators…">
      </div>
      <nav id="calcList" class="calc-list"></nav>
      <div class="sidebar-footer">🔒 Runs entirely in your browser — no data leaves your device.</div>
    </aside>

    <main id="content" class="content">
      <div id="welcome" class="welcome">
        <span class="welcome-badge">32 calculators · verified formulas</span>
        <h1>Welcome to EnginX</h1>
        <p>Select a calculator from the left to begin.</p>
      </div>
      <div id="calcToolbar" class="calc-toolbar" style="display:none;">
        <button class="btn toolbar-btn" id="btnSteps" title="See the full step-by-step calculation on a new page">🪜 Show Steps</button>
        <button class="btn secondary toolbar-btn" id="btnPrint" title="Open a report-style print / Save as PDF view">🖨️ Print / Save PDF</button>
        <button class="btn secondary toolbar-btn" id="btnCopy" title="Copy inputs and results as plain text">⧉ Copy as Text</button>
        <button class="btn secondary toolbar-btn" id="btnCSV" title="Download inputs and results as a CSV file">⬇ Export CSV</button>
      </div>
      <div id="calcContainer" class="calc-container" style="display:none;"></div>
    </main>
  </div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
